<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App | Crixsoft Solution</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="todo-card">
      <h1>My To-Do List</h1>
      <p class="subtitle">Stay organized and get things done.</p>

      <form id="todoForm" class="input-row">
        <input id="taskInput" type="text" placeholder="Enter a task..." autocomplete="off">
        <button type="submit">Add Task</button>
      </form>

      <div class="toolbar">
        <span id="taskCount">0 tasks</span>
        <button id="clearCompleted" type="button" class="secondary">Clear Completed</button>
      </div>

      <ul id="taskList"></ul>
      <p id="emptyMessage" class="empty">No tasks yet. Add your first task!</p>
    </section>
    <footer>Web Development Internship • Crixsoft Solution</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
